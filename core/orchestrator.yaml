# Product Orchestration Workflow Definition

version: 1.0
name: "Atlas Product Launch Orchestrator"
owner: "ceo"

# Phase definitions with dependencies and parallelization
phases:
  phase_1_validation:
    name: "Market & Product Validation"
    duration_days: 7
    parallel: true
    agents:
      - agent: market-research
        task: "Analyze market size, competition, customer demand signals"
        deliverables:
          - market-analysis.md
          - competitor-landscape.json
          - tam-sam-som.xlsx
        timeline_days: 5

      - agent: product-manager
        task: "Define MVP scope, user stories, pricing hypothesis"
        deliverables:
          - product-brief.md
          - user-stories.json
          - feature-roadmap.json
        timeline_days: 5

      - agent: brand
        task: "Validate naming, positioning, tone"
        deliverables:
          - positioning-statement.md
          - naming-rationale.json
          - brand-tone-guide.md
        timeline_days: 3

      - agent: data-analyst
        task: "Define success KPIs and baseline metrics"
        deliverables:
          - success-metrics.json
          - growth-model.json
          - dashboard-spec.json
        timeline_days: 3

    decision_gate:
      type: "go-nogo"
      decision_maker: "human"
      criteria:
        - market_tam_min: 500000  # $500K annual TAM minimum
        - competition_assessed: true
        - differentiation_clear: true
        - team_alignment: true
      escalation:
        - if: "market_tam < 300000"
          action: "REJECT - Market too small"
        - if: "no_clear_differentiation"
          action: "PIVOT - Reposition and retry"
        - if: "team_concerns"
          action: "HUMAN_DECISION - Board review required"

  phase_2_architecture:
    name: "Design & Architecture"
    duration_days: 5
    depends_on: "phase_1_validation"
    gate_decision: "go"
    parallel: true
    agents:
      - agent: fullstack
        task: "UI/UX design, component architecture, database schema"
        deliverables:
          - ui-mockups.figma
          - component-library.md
          - database-schema.sql
          - api-specification.openapi.json
        timeline_days: 4

      - agent: platform-engineer
        task: "Infrastructure design, deployment pipeline, security"
        deliverables:
          - infrastructure-diagram.md
          - deployment-strategy.md
          - security-checklist.json
          - env-config-template.yaml
        timeline_days: 4

    decision_gate:
      type: "architecture-review"
      decision_maker: "human"
      criteria:
        - technical_feasibility: true
        - timeline_realistic: true
        - budget_aligned: true
        - security_approved: true

  phase_2b_marketing:
    name: "Content & Marketing Setup (Parallel)"
    duration_days: 7
    depends_on: "phase_1_validation"
    gate_decision: "go"
    parallel: true
    agents:
      - agent: content
        task: "Landing page copy, email sequences, help docs"
        deliverables:
          - landing-page-copy.md
          - email-welcome-sequence.json
          - knowledge-base-outline.md
        timeline_days: 5

      - agent: social-media
        task: "Content calendar, teaser strategy, engagement plan"
        deliverables:
          - content-calendar.json
          - social-strategy.md
          - launch-post-drafts.json
        timeline_days: 5

      - agent: email
        task: "Email automation sequences and flows"
        deliverables:
          - automation-flows.json
          - email-templates.html
          - segmentation-rules.json
        timeline_days: 3

      - agent: growth
        task: "GTM strategy, acquisition plan, conversion funnel"
        deliverables:
          - gtm-strategy.md
          - customer-acquisition-plan.json
          - funnel-optimization-plan.md
        timeline_days: 5

    review_gate:
      type: "content-approval"
      decision_maker: "human"

  phase_3_development:
    name: "Development & Testing"
    duration_days: 14
    depends_on: "phase_2_architecture"
    gate_decision: "approved"
    parallel: true
    agents:
      - agent: fullstack
        task: "Build frontend, integrate APIs, connect database"
        deliverables:
          - frontend-repo: "git-commit-hash"
          - deployed-staging: "staging-url"
          - feature-checklist.json
        timeline_days: 14

      - agent: platform-engineer
        task: "Setup infrastructure, CI/CD, monitoring"
        deliverables:
          - infrastructure-deployed: "aws-resource-list"
          - ci-cd-pipeline: "github-actions-yaml"
          - monitoring-dashboard: "datadog-link"
        timeline_days: 10

      - agent: qa
        task: "Test automation, edge cases, performance"
        deliverables:
          - test-suite: "test-results.json"
          - performance-report: "lighthouse-scores.json"
          - bug-log: "issues-tracker.json"
        timeline_days: 14

    blocker_check:
      frequency: "daily"
      escalation: "auto"
      criteria:
        - critical_bugs_found
        - timeline_at_risk
        - resource_blocked

  phase_4_launch:
    name: "Go-Live Coordination"
    duration_days: 1
    depends_on: "phase_3_development"
    gate_decision: "approved"
    sequential: true
    actions:
      - step: "activate-features"
        agent: platform-engineer
        duration_minutes: 30
      - step: "enable-analytics"
        agent: data-analyst
        duration_minutes: 15
      - step: "activate-email"
        agent: email
        duration_minutes: 10
      - step: "launch-content"
        agent: social-media
        duration_minutes: 15
      - step: "monitor-health"
        agent: data-analyst
        duration_minutes: 60

    launch_gate:
      type: "final-approval"
      decision_maker: "human"
      go_no_go_deadline: "T-4 hours"

  phase_5_post_launch:
    name: "Post-Launch & Growth"
    duration_days: 30
    depends_on: "phase_4_launch"
    continuous: true
    agents:
      - agent: customer-success
        task: "Onboarding, support automation, feedback collection"
        cadence: "daily"

      - agent: growth
        task: "Conversion optimization, retention loops, upsells"
        cadence: "daily"

      - agent: data-analyst
        task: "Real-time analytics, cohort analysis, growth metrics"
        cadence: "daily"

    success_metrics:
      week_1:
        - users_onboarded_min: 50
        - nps_score_min: 30
        - churn_rate_max: 10
      week_2:
        - paid_conversion_min: 10
        - mrr_min: 500
      week_4:
        - retention_week4_min: 40
        - customer_acquisition_cost: "calculated"

# Approval Checkpoints (Human Required)
approval_checkpoints:
  market_validation:
    phase: phase_1_validation
    trigger: "end-of-phase"
    stakeholders: ["ceo", "human"]
    approval_sla_hours: 24
    required_docs:
      - market-analysis.md
      - positioning-statement.md
      - success-metrics.json
      - go-nogo-recommendation.md

  architecture_review:
    phase: phase_2_architecture
    trigger: "end-of-phase"
    stakeholders: ["platform-engineer", "ceo", "human"]
    approval_sla_hours: 24
    required_docs:
      - ui-mockups.figma
      - architecture-diagram.md
      - deployment-strategy.md
      - risk-assessment.json

  launch_readiness:
    phase: phase_3_development
    trigger: "end-of-phase"
    stakeholders: ["fullstack", "platform-engineer", "qa", "ceo", "human"]
    approval_sla_hours: 8
    required_docs:
      - test-results.json
      - performance-report.md
      - bug-log.json
      - launch-checklist.json

  final_launch:
    phase: phase_4_launch
    trigger: "4-hours-before"
    stakeholders: ["ceo", "human"]
    approval_sla_hours: 4
    required_docs:
      - final-readiness-summary.md
      - incident-response-plan.md
      - rollback-procedure.md

# Escalation Rules
escalation:
  timeline_miss:
    trigger: "phase_end_date - phase_actual_end_date > 3_days"
    action:
      - notify: ["ceo", "human"]
      - decision_required: "pivot|cut-scope|extend-timeline"
    urgency: "high"

  budget_overrun:
    trigger: "spent > budget * 1.2"
    action:
      - notify: ["ceo", "human"]
      - decision_required: "approve-budget|reduce-scope"
    urgency: "high"

  market_validation_failed:
    trigger: "tam < 300k OR competitive_advantage_unclear"
    action:
      - recommendation: "REJECT"
      - decision_required: "pivot|kill|continue-anyway"
    urgency: "critical"

  critical_bug_found:
    trigger: "bug.severity = critical AND phase = phase_3_development"
    action:
      - notify: ["fullstack", "qa", "ceo"]
      - decision_required: "hotfix|delay-launch"
    urgency: "critical"

  performance_issue:
    trigger: "lighthouse_score < 70 OR api_latency > 500ms"
    action:
      - notify: ["platform-engineer", "data-analyst"]
      - decision_required: "optimize|accept-risk"
    urgency: "high"

# Product Metadata Template
product_metadata:
  template:
    id: "generated-uuid"
    name: "string"
    description: "string"
    created_date: "iso-8601"
    created_by: "human-email"
    target_users: "string[]"
    budget_hypothesis: "usd"
    timeline_constraint: "4-weeks|8-weeks|flexible"
    current_phase: "phase_1_validation|phase_2_architecture|phase_3_development|phase_4_launch|phase_5_post_launch"
    current_phase_progress: "0-100%"
    expected_launch_date: "iso-8601"
    approval_history: "object[]"
    risk_level: "low|medium|high"
    dependencies: "string[]"  # References to other products
    status: "active|paused|completed|killed"
